name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
        env:
          NO_PROXY: 127.0.0.1,localhost
  import-on-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: The real backend's frameworks import and the test suite passes on macOS
        run: |
          cd mac-agent && python -c "import Quartz, AppKit, ApplicationServices, backends, macpc_agent; print('ok')"
          cd .. && pytest -q
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check that no token / private key was committed by mistake
        run: |
          set +e
          grep -rIEl --exclude-dir=.git --exclude-dir=tests --exclude=fileops.py --exclude=test.yml \
            -e '-----BEGIN [A-Z ]*PRIVATE KEY-----' -e 'PuTTY-User-Key-File' .
          rc=$?
          if [ $rc -eq 0 ]; then echo "Suspected private-key/token files found, see the list above"; exit 1; fi
          if [ $rc -ne 1 ]; then echo "The scan command itself failed (rc=$rc)"; exit 1; fi
